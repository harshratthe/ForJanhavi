<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Our Escape — A Little Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3B1F2B;
    --ink-soft:#5A3A46;
    --cream:#F6EDE2;
    --cream-dim:#EFE2D2;
    --rose:#D98B95;
    --rose-deep:#B96876;
    --teal:#5C8374;
    --gold:#D9A566;
    --line: rgba(59,31,43,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(600px 500px at 15% -5%, rgba(217,139,149,0.25), transparent 60%),
      radial-gradient(500px 400px at 90% 15%, rgba(92,131,116,0.20), transparent 60%),
      linear-gradient(180deg, #2F1721 0%, #3B1F2B 40%, #40222F 100%);
    font-family:'Outfit', sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .blob{position:fixed; border-radius:50%; filter:blur(60px); opacity:0.35; pointer-events:none; z-index:0;}
  .blob1{width:280px;height:280px; background:var(--rose); top:-80px; left:-90px; animation: drift1 22s ease-in-out infinite;}
  .blob2{width:240px;height:240px; background:var(--teal); bottom:5%; right:-80px; animation: drift2 26s ease-in-out infinite;}
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(30px,40px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-25px,-30px);} }

  .app{
    position:relative; z-index:1;
    width:100%; max-width:460px;
    min-height:100vh;
    padding: 34px 18px 60px;
  }
  .app-anim{ animation: fadeSlideIn 0.55s cubic-bezier(.2,.7,.3,1); }
  @keyframes fadeSlideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .sparkle{position:absolute; width:4px; height:4px; border-radius:50%; background:var(--gold); opacity:0.5; animation:twinkle 2.8s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0.15; transform:scale(0.7);} 50%{opacity:0.95; transform:scale(1.4);}}

  /* HEADER */
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--gold); text-align:center; margin-bottom:6px; opacity:0.9;
    animation: fadeIn 0.8s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  h1.title{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    font-size:34px; text-align:center; margin:0 0 4px; color:var(--cream);
    letter-spacing:0.01em;
  }
  .subtitle{
    text-align:center; font-size:13.5px; color:var(--cream); opacity:0.65;
    margin-bottom:30px; font-weight:300;
  }

  /* ===== INTRO ===== */
  .intro-wrap{
    position:relative; min-height:72vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:22px; padding:0 6px;
  }
  .skip-link{
    position:absolute; top:0; right:0; font-family:'Space Mono', monospace; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--cream); opacity:0.4;
    cursor:pointer; padding:6px 10px;
  }
  .skip-link:active{ opacity:0.8; }
  .intro-lines{ animation: introRise 0.7s cubic-bezier(.2,.7,.3,1); }
  @keyframes introRise{ from{opacity:0; transform:translateY(18px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .intro-l1{ font-family:'Outfit', sans-serif; font-weight:300; font-size:16px; opacity:0.7; letter-spacing:0.02em; margin-bottom:6px;}
  .intro-l2{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:32px; line-height:1.35; color:var(--cream);}
  .intro-dots{ display:flex; gap:7px; margin-top:6px; }
  .intro-dots span{ width:6px; height:6px; border-radius:50%; background:rgba(246,237,226,0.25); transition: all 0.3s ease;}
  .intro-dots span.active{ background:var(--gold); width:18px; border-radius:4px; }
  .intro-btn{
    margin-top:10px; background:var(--rose); color:var(--ink); border:none; border-radius:24px;
    padding:12px 30px; font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; cursor:pointer; box-shadow:0 10px 24px rgba(217,139,149,0.35);
    transition: transform 0.15s ease;
  }
  .intro-btn:active{ transform:scale(0.95); }

  /* ===== COUNTDOWN / DEPARTURE BOARD ===== */
  .board{
    position:relative;
    background: linear-gradient(180deg, #241119, #2E1520);
    border:1px solid rgba(246,237,226,0.08);
    border-radius:18px;
    padding:24px 18px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
  }
  .board-label{
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--rose); text-align:center; margin-bottom:16px;
  }
  .flap-row{ display:flex; justify-content:center; gap:10px; }
  .flap-group{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .flap-unit{
    position:relative; width:58px; height:64px;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-dim) 100%);
    border-radius:8px; overflow:hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  }
  .flap-unit::after{
    content:''; position:absolute; left:0; right:0; top:50%; height:1px;
    background:rgba(59,31,43,0.25); transform:translateY(-0.5px); z-index:3;
  }
  .flap-digits{ position:relative; width:100%; height:100%; }
  .flap-digit{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace; font-weight:700; font-size:30px; color:var(--ink);
    transition: transform 0.5s cubic-bezier(.4,0,.2,1), opacity 0.5s ease;
  }
  .flap-digit.exit{ transform:translateY(-100%); opacity:0; }
  .flap-digit.enter{ transform:translateY(0); opacity:1; }
  .flap-digit.pre-enter{ transform:translateY(100%); opacity:0; }
  .flap-caption{
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--cream); opacity:0.55;
  }
  .board-foot{
    margin-top:20px; padding-top:14px; border-top:1px dashed rgba(246,237,226,0.15);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono', monospace; font-size:11px; color:var(--cream); opacity:0.75;
  }
  .board-msg{
    margin-top:18px; text-align:center; font-family:'Fraunces', serif; font-style:italic;
    font-size:16px; color:var(--cream); opacity:0.9; line-height:1.5; padding:0 6px;
  }

  /* ===== DAY TABS (ticket stubs) ===== */
  .tabs{
    display:flex; gap:8px; overflow-x:auto; padding:26px 2px 6px; margin-bottom:6px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; position:relative; cursor:pointer;
    width:64px; padding:12px 6px 10px; border-radius:10px;
    background:rgba(246,237,226,0.06); border:1px solid rgba(246,237,226,0.12);
    text-align:center; transition: all 0.25s ease;
  }
  .tab:active{ transform:scale(0.94); }
  .tab .tnum{ font-family:'Space Mono', monospace; font-size:10px; color:var(--gold); opacity:0.8; }
  .tab .tday{ font-family:'Fraunces', serif; font-size:15px; margin-top:2px; color:var(--cream); }
  .tab .tdate{ font-family:'Space Mono', monospace; font-size:9px; color:var(--cream); opacity:0.5; margin-top:3px;}
  .tab.active{ background: var(--rose); border-color:var(--rose); transform:translateY(-3px); box-shadow:0 8px 18px rgba(217,139,149,0.35); animation: tabGlow 2s ease-in-out infinite;}
  @keyframes tabGlow{ 0%,100%{ box-shadow:0 8px 18px rgba(217,139,149,0.35);} 50%{ box-shadow:0 8px 24px rgba(217,139,149,0.55);} }
  .tab.active .tnum, .tab.active .tdate{ color:rgba(59,31,43,0.65); }
  .tab.active .tday{ color:var(--ink); }
  .tab.done::before{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--teal); color:var(--cream); font-size:10px; display:flex; align-items:center; justify-content:center;
  }
  .tab.locked{ opacity:0.55; }
  .tab.locked .tday::after{ content:' 🔒'; font-size:10px; }

  /* ===== TICKET CARD ===== */
  .ticket{
    background: var(--cream); color:var(--ink); border-radius:16px; margin-top:14px;
    overflow:hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.3);
    animation: riseIn 0.5s ease;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .ticket + .ticket{ margin-top:16px; }
  .ticket-head{
    background: linear-gradient(120deg, var(--rose), var(--rose-deep));
    padding:16px 18px; color:var(--cream); position:relative;
  }
  .ticket-head.guess-head{ background: linear-gradient(120deg, var(--teal), #3E5E52); }
  .ticket-head .day-tag{ font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.85;}
  .ticket-head h2{ font-family:'Fraunces', serif; font-weight:500; font-size:22px; margin:4px 0 2px; }
  .ticket-head .place{ font-size:12.5px; opacity:0.9; }
  .ticket-body{ padding:16px 18px 18px; }
  .meta-row{
    display:flex; align-items:center; gap:8px; font-family:'Space Mono', monospace;
    font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; letter-spacing:0.02em;
  }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--teal); }

  .art-slot{
    border-radius:12px; overflow:hidden; margin-bottom:14px; height:150px;
    box-shadow: inset 0 0 0 1px rgba(59,31,43,0.08);
  }
  .art-slot svg{ width:100%; height:100%; display:block; }

  .photo-slot{
    position:relative; overflow:hidden;
    border:1.5px dashed rgba(59,31,43,0.25); border-radius:12px;
    height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--ink-soft); background:rgba(92,131,116,0.06); margin-bottom:14px;
  }
  .photo-slot::before{
    content:''; position:absolute; top:0; left:-150%; width:150%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    animation:shimmer 3.2s infinite;
  }
  @keyframes shimmer{ 0%{left:-150%;} 100%{left:150%;} }
  .photo-slot svg{ width:26px; height:26px; opacity:0.5; }
  .photo-slot span{ font-size:11px; letter-spacing:0.04em; opacity:0.6; }

  .note{
    font-family:'Fraunces', serif; font-style:italic; font-size:15.5px; line-height:1.6;
    color:var(--ink-soft); border-left:2px solid var(--gold); padding-left:12px;
  }

  .perf{ display:flex; justify-content:space-between; padding:0 6px; margin-top:2px; }
  .perf span{ width:6px; height:6px; border-radius:50%; background:var(--ink); opacity:0.08; margin-top:-3px;}

  /* Guess card */
  .mini-count{
    font-family:'Space Mono', monospace; font-size:13px; text-align:center; color:var(--ink);
    background:rgba(92,131,116,0.1); border-radius:10px; padding:10px; margin-bottom:14px; letter-spacing:0.03em;
  }
  .guess-prompt{ font-family:'Fraunces', serif; font-style:italic; font-size:15px; margin-bottom:10px; color:var(--ink-soft); }
  .guess-input{
    width:100%; min-height:70px; border-radius:10px; border:1.5px solid rgba(59,31,43,0.18);
    padding:12px; font-family:'Outfit', sans-serif; font-size:14px; color:var(--ink);
    background:rgba(217,139,149,0.06); resize:vertical; outline:none;
  }
  .guess-input:focus{ border-color:var(--teal); }
  .ghost-btn{
    margin-top:10px; background:transparent; color:var(--ink); border:1.5px solid var(--ink);
    border-radius:20px; padding:9px 20px; font-family:'Space Mono', monospace; font-size:11px;
    letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition: all 0.15s ease;
  }
  .ghost-btn:active{ transform:scale(0.96); background:var(--ink); color:var(--cream); }
  .guess-feedback{
    margin-top:12px; font-family:'Fraunces', serif; font-style:italic; font-size:14.5px;
    color:var(--teal); background:rgba(92,131,116,0.08); border-radius:10px; padding:10px 12px; line-height:1.5;
    animation: riseIn 0.4s ease;
  }

  .complete-btn{
    display:block; width:100%; margin-top:16px; background:var(--gold); color:var(--ink); border:none;
    border-radius:20px; padding:12px 16px; font-family:'Space Mono', monospace; font-size:11.5px;
    letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
    animation: pulseGlow 2.4s ease-in-out infinite;
  }
  .complete-btn:active{ transform:scale(0.97); }
  @keyframes pulseGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,165,102,0.45);} 50%{ box-shadow:0 0 0 9px rgba(217,165,102,0);} }
  .complete-btn.done{ background:var(--teal); color:var(--cream); animation:none; }

  /* Day 6 note box */
  .noteboard textarea{
    width:100%; min-height:90px; border-radius:10px; border:1.5px solid rgba(59,31,43,0.18);
    padding:12px; font-family:'Fraunces', serif; font-style:italic; font-size:15px; color:var(--ink);
    background:rgba(217,139,149,0.06); resize:vertical; outline:none;
  }
  .noteboard textarea:focus{ border-color:var(--rose); }
  .noteboard button{
    margin-top:10px; background:var(--ink); color:var(--cream); border:none; border-radius:20px;
    padding:9px 20px; font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; cursor:pointer; transition: transform 0.15s ease;
  }
  .noteboard button:active{ transform:scale(0.96); }
  .saved-pill{
    display:inline-block; margin-top:10px; font-family:'Space Mono', monospace; font-size:10.5px;
    color:var(--teal); opacity:0.85;
  }

  /* Finale */
  .finale{ position:relative; text-align:center; padding:50px 10px 10px; animation: riseIn 0.6s ease; }
  .finale h2{ font-family:'Fraunces', serif; font-style:italic; font-size:28px; margin-bottom:10px; }
  .finale p{ font-size:14px; opacity:0.75; line-height:1.7; padding:0 8px; }

  .day-divider{ display:flex; align-items:center; gap:10px; margin:26px 0 10px; }
  .day-divider .line{ flex:1; height:1px; background:rgba(246,237,226,0.15); }
  .day-divider span{
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--gold); opacity:0.9; white-space:nowrap;
  }

  .mode-bar{ display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .mode-toggle{
    display:flex; align-items:center; gap:8px; background:rgba(246,237,226,0.07);
    border:1px solid rgba(246,237,226,0.15); border-radius:20px; padding:6px 14px;
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--cream); opacity:0.85; cursor:pointer; user-select:none;
    transition: all 0.2s ease;
  }
  .mode-toggle:active{ transform:scale(0.97); }
  .mode-toggle .sw{
    width:30px; height:16px; border-radius:10px; background:rgba(246,237,226,0.2);
    position:relative; transition: background 0.2s ease;
  }
  .mode-toggle .sw::after{
    content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
    background:var(--cream); transition: transform 0.2s ease;
  }
  .mode-toggle.on .sw{ background:var(--teal); }
  .mode-toggle.on .sw::after{ transform:translateX(14px); }
  .replay-link{
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--cream); opacity:0.4; cursor:pointer; padding:6px 10px;
  }
  .review-flag{
    text-align:center; font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--gold); opacity:0.85; margin:6px 0 16px;
  }

  .footer-note{
    text-align:center; margin-top:40px; font-family:'Space Mono', monospace;
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--cream); opacity:0.35;
  }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="app" id="app"></div>

<script>
/* ============ EDIT THIS SECTION TO CUSTOMIZE ============ */
const HER_NAME = "Janhavi";
const TRIP_TITLE = "Our Escape";
const TRIP_SUBTITLE = "A little journey, just for us";
const COUNTDOWN_MESSAGE = "Pack your favourite playlist. In a few days, it's just you, me, and everything we've been looking forward to.";
const FINALE_MESSAGE = "Six days, side by side. Bowling lights, lake air, burger nights, beach breeze, pizza afternoons, and whatever we made of the last one. This is where it lives now — in the little notes above, and in us.";

const INTRO_SLIDES = [
  { l1:"Hi,", l2:HER_NAME + "." },
  { l1:"It's been a while", l2:"since we've gone out somewhere, just us two." },
  { l1:"So I planned something", l2:"six days, side by side." },
  { l1:"No spoilers though —", l2:"you'll unlock each day as it comes." },
  { l1:"Ready?", l2:"Let's go.", final:true }
];

const ART = {
  bowling: `<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="artBowl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3B1F2B"/><stop offset="100%" stop-color="#B96876"/></linearGradient></defs><rect width="320" height="150" fill="url(#artBowl)"/><line x1="0" y1="130" x2="320" y2="130" stroke="#F6EDE2" stroke-opacity="0.15" stroke-width="2"/><g fill="#F6EDE2"><ellipse cx="200" cy="55" rx="7" ry="16"/><ellipse cx="215" cy="62" rx="7" ry="16"/><ellipse cx="185" cy="62" rx="7" ry="16"/><ellipse cx="207" cy="72" rx="7" ry="16"/><ellipse cx="193" cy="72" rx="7" ry="16"/></g><circle cx="105" cy="95" r="22" fill="#D9A566"/><circle cx="98" cy="88" r="2.5" fill="#3B1F2B"/><circle cx="107" cy="86" r="2.5" fill="#3B1F2B"/><circle cx="103" cy="94" r="2.5" fill="#3B1F2B"/><text x="160" y="140" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10.5" letter-spacing="2" fill="#F6EDE2" fill-opacity="0.75">TIME ZONE · BOWLING NIGHT</text></svg>`,

const app = document.getElementById('app');

// ---- state ----
let appState = 'intro';       // 'intro' | 'main'
let introIndex = 0;
let introSeen = false;
let selectedDayId = null;
let dayStatus = {};           // {id:{completed:true}}
let guesses = {};             // {id:{text, feedback}}
let forceFinale = false;
let day6NoteText = '';

function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function dayUnlock(day){ return day.blocks[0].start; }
function dayIsLocked(day, now){ return now < dayUnlock(day); }
function allBlocksUnlocked(day, now){ return day.blocks.every(b => now >= b.start); }

function getPhase(now){
  if (now < TRIP.start) return 'countdown';
  if (now <= TRIP.end) return 'journey';
  return 'finale';
}
function currentDayIndex(now){
  for (let i=0;i<TRIP.days.length;i++){ if (sameDate(now, TRIP.days[i].date)) return i; }
  let idx = 0;
  for (let i=0;i<TRIP.days.length;i++){ if (TRIP.days[i].date <= now) idx = i; }
  return idx;
}
function fmtCountdown(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  return { days:Math.floor(totalSec/86400), hours:Math.floor((totalSec%86400)/3600), mins:Math.floor((totalSec%3600)/60), secs:totalSec%60 };
}
function fmtShort(ms){
  const {days,hours,mins} = fmtCountdown(ms);
  if (days>0) return days+'d '+hours+'h '+mins+'m';
  const s = Math.max(0,Math.floor(ms/1000))%60;
  return hours+'h '+mins+'m '+s+'s';
}

/* ---------- persistence ---------- */
async function saveState(){
  try{ await window.storage.set('appstate', JSON.stringify({dayStatus, selectedDayId, guesses, forceFinale}), true); }catch(e){}
}
async function saveIntroSeen(){
  try{ await window.storage.set('introSeen', '1', true); }catch(e){}
}
async function saveDay6(){
  const val = document.getElementById('day6input').value.trim();
  const pill = document.getElementById('day6saved');
  if (!val) return;
  day6NoteText = val;
  try{ await window.storage.set('day6-note', val, true); if(pill) pill.textContent = 'saved ✓'; }
  catch(e){ if(pill) pill.textContent = 'saved on this device'; }
}
window.saveDay6 = saveDay6;

async function init(){
  try{
    const r = await window.storage.get('appstate', true);
    if (r && r.value){
      const s = JSON.parse(r.value);
      dayStatus = s.dayStatus || {};
      selectedDayId = s.selectedDayId ?? null;
      guesses = s.guesses || {};
      forceFinale = !!s.forceFinale;
    }
  }catch(e){}
  try{ const r2 = await window.storage.get('introSeen', true); introSeen = !!(r2 && r2.value==='1'); }catch(e){ introSeen = false; }
  try{ const r3 = await window.storage.get('day6-note', true); if (r3 && r3.value) day6NoteText = r3.value; }catch(e){}
  const now = new Date();
  if (getPhase(now) === 'finale') finaleShown = true;
  if (now >= TRIP.start){
    // Day 1 has already begun — the welcome page must never appear, even on first visit.
    introSeen = true;
    appState = 'main';
  } else {
    appState = introSeen ? 'main' : 'intro';
  }
  render(true);
  startTimers();
}

/* ---------- guess feedback ---------- */
const WARM_LINES = [
  "Ooh, you're getting warm... 👀",
  "Hmm, interesting guess — you might be onto something 😉",
  "Okay that's suspiciously close 👀"
];
const COOL_LINES = [
  "Cute guess, but not telling 😄",
  "Nice try! Let's see if you're right 😘",
  "I love that you're guessing already 💛"
];
function guessFeedback(block, text){
  const t = (text||'').toLowerCase();
  const keywords = (block.title + ' ' + block.place).toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3);
  const warm = keywords.some(k => t.includes(k));
  const base = warm ? WARM_LINES[Math.floor(Math.random()*WARM_LINES.length)] : COOL_LINES[Math.floor(Math.random()*COOL_LINES.length)];
  return base + " You'll find out for real when the time comes — stay excited, baby 💛";
}
window.submitGuess = function(key, dayId, idx){
  const day = TRIP.days.find(d=>d.id===dayId);
  const block = day.blocks[idx];
  const val = document.getElementById('guessinput-'+key).value.trim();
  if (!val) return;
  guesses[key] = { text: val, feedback: guessFeedback(block, val) };
  saveState();
  render(true);
};

/* ---------- navigation actions ---------- */
window.onTabClick = function(idx){ selectedDayId = TRIP.days[idx].id; saveState(); render(true); };
window.markComplete = function(id){
  dayStatus[id] = dayStatus[id] || {};
  dayStatus[id].completed = true;
  const idx = TRIP.days.findIndex(d=>d.id===id);
  if (idx < TRIP.days.length-1){ selectedDayId = TRIP.days[idx+1].id; }
  else { forceFinale = true; }
  saveState();
  render(true);
  window.scrollTo({top:0, behavior:'smooth'});
};
window.introNext = function(){
  if (introIndex >= INTRO_SLIDES.length-1){ finishIntro(); return; }
  introIndex++;
  render(true);
};
window.skipIntro = function(){ finishIntro(); };
function finishIntro(){ introSeen = true; saveIntroSeen(); appState='main'; introIndex=0; render(true); }
window.replayIntro = function(){
  if (new Date() >= TRIP.start) return; // locked out once Day 1 has begun
  appState='intro'; introIndex=0; render(true);
};

/* ---------- render pieces ---------- */
function sparkles(n){
  let h='';
  for(let i=0;i<n;i++){
    const top = 8 + Math.random()*80, left = 5 + Math.random()*90, delay=(Math.random()*2.5).toFixed(2);
    h += `<div class="sparkle" style="top:${top}%; left:${left}%; animation-delay:${delay}s;"></div>`;
  }
  return h;
}

function renderIntro(){
  const s = INTRO_SLIDES[introIndex];
  let dots='';
  INTRO_SLIDES.forEach((_,i)=>{ dots += `<span class="${i===introIndex?'active':''}"></span>`; });
  return `<div class="intro-wrap">
    ${sparkles(10)}
    <div class="intro-lines">
      <div class="intro-l1">${s.l1}</div>
      <div class="intro-l2">${s.l2}</div>
    </div>
    <div class="intro-dots">${dots}</div>
    <button class="intro-btn" onclick="introNext()">${s.final ? "Let's go" : 'Next'}</button>
  </div>`;
}

function renderPhotoSlot(){
  return `<div class="photo-slot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.2-2h5.6L16 5"/></svg>
    <span>photo memory goes here</span>
  </div>`;
}
function renderPerf(){ let d=''; for(let i=0;i<14;i++) d+='<span></span>'; return `<div class="perf">${d}</div>`; }

function blockHtml(day, block){
  const media = block.art ? `<div class="art-slot">${block.art}</div>` : renderPhotoSlot();
  if (block.open){
    return `<div class="ticket noteboard">
      <div class="ticket-head">
        <div class="day-tag">${day.code} · ${block.time}</div>
        <h2>${block.title}</h2>
        <div class="place">${block.place}</div>
      </div>
      <div class="ticket-body">
        ${media}
        <div class="meta-row"><span class="dot"></span> Open slot — tell me what you're thinking</div>
        <textarea id="day6input" placeholder="Write what you'd like to do here...">${day6NoteText}</textarea>
        <br/><button onclick="saveDay6()">Save this note</button>
        <div id="day6saved" class="saved-pill">${day6NoteText ? 'saved ✓' : ''}</div>
      </div>
    </div>`;
  }
  return `<div class="ticket">
    <div class="ticket-head">
      <div class="day-tag">${day.code} · ${block.time}</div>
      <h2>${block.title}</h2>
      <div class="place">${block.place}</div>
    </div>
    <div class="ticket-body">
      <div class="meta-row"><span class="dot"></span> ${day.label}</div>
      ${media}
      <div class="note">${block.note}</div>
    </div>
    ${renderPerf()}
  </div>`;
}

function guessCardHtml(day){
  const unlock = dayUnlock(day);
  const block = day.blocks[0];
  const key = day.id + '_0';
  const g = guesses[key];
  return `<div class="ticket guess-card">
    <div class="ticket-head guess-head">
      <div class="day-tag">${day.code} · LOCKED</div>
      <h2>${day.label}</h2>
      <div class="place">Unlocks ${unlock.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}, ${unlock.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="ticket-body">
      <div class="mini-count" id="mini-${key}" data-target="${unlock.toISOString()}">calculating…</div>
      <div class="guess-prompt">Think you know what's happening on ${day.label.toLowerCase()}? Take a guess 👇</div>
      <textarea id="guessinput-${key}" class="guess-input" placeholder="Type your guess...">${g ? g.text : ''}</textarea>
      <button class="ghost-btn" onclick="submitGuess('${key}', ${day.id}, 0)">Submit guess</button>
      ${g ? `<div class="guess-feedback">${g.feedback}</div>` : ''}
    </div>
  </div>`;
}

function blockGuessCard(day, block, idx){
  const key = day.id + '_' + idx;
  const g = guesses[key];
  return `<div class="ticket guess-card">
    <div class="ticket-head guess-head">
      <div class="day-tag">${day.code} · NEXT UP</div>
      <h2>Later today...</h2>
      <div class="place">Unlocks ${block.start.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="ticket-body">
      <div class="mini-count" id="mini-${key}" data-target="${block.start.toISOString()}">calculating…</div>
      <div class="guess-prompt">Something else is planned for later — care to guess? 👇</div>
      <textarea id="guessinput-${key}" class="guess-input" placeholder="Type your guess...">${g ? g.text : ''}</textarea>
      <button class="ghost-btn" onclick="submitGuess('${key}', ${day.id}, ${idx})">Submit guess</button>
      ${g ? `<div class="guess-feedback">${g.feedback}</div>` : ''}
    </div>
  </div>`;
}

function completeButtonHtml(day){
  const done = dayStatus[day.id] && dayStatus[day.id].completed;
  return `<button class="complete-btn ${done?'done':''}" onclick="markComplete(${day.id})">
    ${done ? '✓ Marked complete — tap for next day' : 'We did this — mark complete →'}
  </button>`;
}

function renderTabs(now, activeIdx){
  let html = '<div class="tabs">';
  TRIP.days.forEach((day,i)=>{
    const locked = dayIsLocked(day, now);
    const completed = dayStatus[day.id] && dayStatus[day.id].completed;
    const isPast = !locked && (completed || day.blocks[day.blocks.length-1].start < now);
    let cls = 'tab';
    if (i===activeIdx) cls += ' active';
    if (isPast) cls += ' done';
    if (locked) cls += ' locked';
    html += `<div class="${cls}" onclick="onTabClick(${i})">
      <div class="tnum">0${day.id}</div>
      <div class="tday">${day.label.replace('Day ','')}</div>
      <div class="tdate">${day.date.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderModeBar(){
  const canReplay = new Date() < TRIP.start;
  if (!canReplay) return '';
  return `<div class="mode-bar">
    <div class="replay-link" onclick="replayIntro()">▶ replay welcome</div>
  </div>`;
}

/* ---------- main render ---------- */
function render(animate){
  const now = new Date();

  if (appState === 'intro' && now >= TRIP.start){
    // Safety net: never show the welcome page once Day 1 has begun.
    introSeen = true;
    appState = 'main';
  }

  if (appState === 'intro'){
    app.innerHTML = renderIntro();
    if (animate){ app.classList.remove('app-anim'); void app.offsetWidth; app.classList.add('app-anim'); }
    return;
  }

  let body = `<div class="eyebrow">Boarding Pass</div>
  <h1 class="title">${TRIP_TITLE}</h1>
  <div class="subtitle">${TRIP_SUBTITLE}</div>`;
  body += renderModeBar();

  if (forceFinale){
    body += `<div class="finale">${sparkles(8)}<h2>That's a wrap ✦</h2><p>${FINALE_MESSAGE}</p></div>`;
    body += `<div class="footer-note">Made for the two of us</div>`;
    app.innerHTML = body;
    if (animate){ app.classList.remove('app-anim'); void app.offsetWidth; app.classList.add('app-anim'); }
    return;
  }

  const phase = getPhase(now);
  if (phase === 'countdown'){
    body += `<div class="board">${sparkles(6)}
      <div class="board-label">✦ Departure Countdown ✦</div>
      <div class="flap-row">
        <div class="flap-group"><div class="flap-unit"><div class="flap-digits" id="flap-d"><div class="flap-digit enter">00</div></div></div><div class="flap-caption">Days</div></div>
        <div class="flap-group"><div class="flap-unit"><div class="flap-digits" id="flap-h"><div class="flap-digit enter">00</div></div></div><div class="flap-caption">Hrs</div></div>
        <div class="flap-group"><div class="flap-unit"><div class="flap-digits" id="flap-m"><div class="flap-digit enter">00</div></div></div><div class="flap-caption">Min</div></div>
        <div class="flap-group"><div class="flap-unit"><div class="flap-digits" id="flap-s"><div class="flap-digit enter">00</div></div></div><div class="flap-caption">Sec</div></div>
      </div>
      <div class="board-foot"><span>DEP · ${TRIP.start.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</span><span>${TRIP.start.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="board-msg">${COUNTDOWN_MESSAGE}</div>
    </div>`;
    app.innerHTML = body;
    flapState = {};
    if (animate){ app.classList.remove('app-anim'); void app.offsetWidth; app.classList.add('app-anim'); }
    return;
  }

  if (phase === 'journey'){
    let activeIdx = currentDayIndex(now);
    if (selectedDayId !== null){
      const idx = TRIP.days.findIndex(d=>d.id===selectedDayId);
      if (idx !== -1) activeIdx = idx;
    }
    body += renderTabs(now, activeIdx);
    const day = TRIP.days[activeIdx];
    if (dayIsLocked(day, now)){
      body += guessCardHtml(day);
    } else {
      day.blocks.forEach((b, idx)=>{
        if (now >= b.start){ body += blockHtml(day, b); }
        else { body += blockGuessCard(day, b, idx); }
      });
      if (allBlocksUnlocked(day, now)){ body += completeButtonHtml(day); }
    }
    body += `<div class="footer-note">Made for the two of us</div>`;
    app.innerHTML = body;
    if (animate){ app.classList.remove('app-anim'); void app.offsetWidth; app.classList.add('app-anim'); }
    return;
  }

  // phase finale (past trip end)
  body += `<div class="finale">${sparkles(8)}<h2>That's a wrap ✦</h2><p>${FINALE_MESSAGE}</p></div>`;
  body += `<div class="footer-note">Made for the two of us</div>`;
  app.innerHTML = body;
  if (animate){ app.classList.remove('app-anim'); void app.offsetWidth; app.classList.add('app-anim'); }
}

/* ---------- timers (do not disrupt typing) ---------- */
let flapState = {};
let finaleShown = false;
function updateFlaps(now){
  const {days,hours,mins,secs} = fmtCountdown(TRIP.start - now);
  const vals = {d:days,h:hours,m:mins,s:secs};
  Object.keys(vals).forEach(id=>{
    const v = pad2(vals[id]);
    const container = document.getElementById('flap-'+id);
    if (!container) return;
    if (flapState[id] !== v){
      const oldDigit = container.querySelector('.flap-digit');
      if (oldDigit){ oldDigit.classList.remove('enter'); oldDigit.classList.add('exit'); }
      const newDigit = document.createElement('div');
      newDigit.className='flap-digit pre-enter'; newDigit.textContent=v;
      container.appendChild(newDigit);
      requestAnimationFrame(()=>{ newDigit.classList.remove('pre-enter'); newDigit.classList.add('enter'); });
      setTimeout(()=>{ if (oldDigit && oldDigit.parentNode) oldDigit.remove(); }, 550);
      flapState[id]=v;
    }
  });
}
function updateMiniCounts(now){
  document.querySelectorAll('.mini-count').forEach(el=>{
    const target = new Date(el.getAttribute('data-target'));
    const diff = target - now;
    el.textContent = diff > 0 ? ('unlocks in ' + fmtShort(diff)) : 'unlocking…';
  });
}

function startTimers(){
  setInterval(()=>{
    const now = new Date();
    const active = document.activeElement;
    const typing = active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT');
    if (appState !== 'main') return;
    if (forceFinale) return;
    if (document.getElementById('flap-d')) updateFlaps(now);
    if (!typing) updateMiniCounts(now);

    // auto-reveal transitions without disrupting typing
    if (!typing){
      const phase = getPhase(now);
      if (phase === 'countdown' && now >= TRIP.start){ render(true); return; }
      if (phase === 'journey'){
        let justUnlocked = false;
        document.querySelectorAll('.guess-card .mini-count').forEach(el=>{
          const target = new Date(el.getAttribute('data-target'));
          if (now >= target) justUnlocked = true;
        });
        if (justUnlocked){ render(true); }
      }
      if (phase === 'finale' && !finaleShown){ finaleShown = true; render(true); }
    }
  }, 1000);
}

init();
</script>
</body>
</html>
